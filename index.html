<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works · Storylab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="site-nav">
      <a class="site-nav__title" href="index.html">Storylab</a>
      <ul class="site-nav__links">
        <li><a href="index.html" aria-current="page">Works</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Works</h1>
    <p>A gallery of stories and drawings made by kids at Storylab.</p>

    <div class="gallery"></div>

    <button id="upload-toggle" class="button" type="button">Upload a story</button>

    <form id="upload-form" class="upload-form" hidden>
      <button type="button" id="upload-close" class="icon-button" aria-label="Close">&times;</button>
      <label>
        Title
        <input type="text" name="title" required>
      </label>
      <label>
        Author
        <input type="text" name="author" required>
      </label>
      <label>
        Age
        <input type="number" name="age" min="0" required>
      </label>
      <label>
        Description
        <textarea name="description" rows="3" required></textarea>
      </label>
      <label>
        Image
        <input type="file" name="image" accept="image/*" required>
      </label>
      <label>
        PDF file
        <input type="file" name="pdf" accept="application/pdf" required>
      </label>
      <label>
        Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="button">Submit</button>
      <p class="upload-form__status" role="status"></p>
    </form>

    <dialog id="delete-dialog" class="delete-dialog">
      <form method="dialog" class="delete-dialog__form">
        <p id="delete-dialog__message"></p>
        <label>
          Password
          <input type="password" id="delete-password" required>
        </label>
        <div class="delete-dialog__actions">
          <button type="button" id="delete-cancel">Cancel</button>
          <button type="submit" value="confirm" class="button">Delete</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer>
    <p>&copy; 2026 Storylab</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
